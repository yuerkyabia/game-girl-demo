<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>管理者審核</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f3efe9;color:#3a3530;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.3rem;margin:0 0 14px}
.card{background:#fff;border:1px solid #ddd3c6;border-radius:12px;padding:14px 16px;margin-bottom:12px}
input[type=password]{width:100%;padding:10px;border:1px solid #b9ab99;border-radius:8px;font-size:1rem}
button{font:inherit;border:1px solid #5d7390;background:#5d7390;color:#fff;border-radius:999px;padding:6px 16px;cursor:pointer}
button.ghost{background:transparent;color:#4a5a70}
button.ok{background:#4f7a56;border-color:#4f7a56}
button.no{background:#b0884a;border-color:#b0884a}
button.del{background:#a8566a;border-color:#a8566a}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
.tabs .sp{flex:1}
.meta{font-size:.8rem;color:#7a6f63;margin-bottom:6px}
.badge{display:inline-block;background:#f0e3e6;color:#a8566a;border-radius:999px;padding:0 10px;font-size:.78rem;margin-left:6px}
h3{margin:0 0 6px;font-size:1.02rem;word-break:break-word}
.body{white-space:pre-wrap;word-break:break-word;margin:6px 0 12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.9rem}
.msg.err{background:#f6dfe4}.msg.ok{background:#dfeedd}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>玩家經驗分享｜管理者審核</h1>

  <div id="login" class="card">
    <p style="margin:0 0 8px">請輸入管理者密碼（只存在這個分頁的記憶體，重新整理或關閉就會清掉）。</p>
    <input id="tk" type="password" autocomplete="off" placeholder="管理者密碼">
    <p style="margin:10px 0 0"><button id="go">登入</button></p>
  </div>

  <div id="panel" class="hide">
    <div class="tabs">
      <button id="tPending">待審核</button>
      <button id="tApproved" class="ghost">已公開</button>
      <span class="sp"></span>
      <button id="reload" class="ghost">重新整理</button>
      <button id="logout" class="ghost">登出</button>
    </div>
    <div id="msg"></div>
    <div id="list"></div>
  </div>
</div>

<script>
const API = "https://pingfan-yitian-api.cherry58999.workers.dev/api";
const CAT = { daily: "日常", campus: "校園", work: "職場", other: "其他" };
let token = "", view = "pending";
const $ = id => document.getElementById(id);

function say(text, ok) {
  const m = $("msg"); m.textContent = "";
  if (!text) return;
  const d = document.createElement("div");
  d.className = "msg " + (ok ? "ok" : "err"); d.textContent = text; m.appendChild(d);
}

async function call(method, path, body) {
  const r = await fetch(API + path, {
    method,
    headers: Object.assign({ Authorization: "Bearer " + token }, body ? { "Content-Type": "application/json" } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); say("密碼不正確或已失效，請重新登入。"); throw new Error("401"); }
  if (!r.ok) throw new Error(d.error || ("錯誤 " + r.status));
  return d;
}

function logout() {
  token = ""; $("tk").value = "";
  $("panel").classList.add("hide"); $("login").classList.remove("hide"); $("list").textContent = "";
}

async function load(keep) {
  if (keep !== true) say(""); $("list").textContent = "載入中…";
  try {
    const d = await call("GET", "/admin/" + view);
    render(d.items || []);
  } catch (e) { $("list").textContent = ""; if (e.message !== "401") say("載入失敗：" + e.message); }
}

function btn(label, cls, fn) {
  const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls;
  b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { if (e.message !== "401") say("操作失敗：" + e.message); b.disabled = false; } };
  return b;
}

function render(items) {
  const box = $("list"); box.textContent = "";
  if (!items.length) { box.textContent = view === "pending" ? "目前沒有待審核的投稿。" : "目前沒有已公開的投稿。"; return; }
  items.forEach(it => {
    const c = document.createElement("div"); c.className = "card";
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = "#" + it.id + "　" + (CAT[it.category] || it.category) + "　" + String(it.created_at || "");
    if (it.report_count > 0) { const bd = document.createElement("span"); bd.className = "badge"; bd.textContent = "被檢舉 " + it.report_count + " 次"; meta.appendChild(bd); }
    const h = document.createElement("h3"); h.textContent = it.title;
    const p = document.createElement("div"); p.className = "body"; p.textContent = it.content;
    const a = document.createElement("div"); a.className = "acts";
    const done = (t) => { say(t, true); load(true); };
    a.appendChild(btn("通過公開", "ok", async () => { await call("PATCH", "/admin/experiences/" + it.id, { status: "approved" }); done("已通過 #" + it.id); }));
    a.appendChild(btn(view === "approved" ? "下架" : "拒絕", "no", async () => { await call("PATCH", "/admin/experiences/" + it.id, { status: "rejected" }); done((view === "approved" ? "已下架 #" : "已拒絕 #") + it.id); }));
    a.appendChild(btn("永久刪除", "del", async () => {
      if (!confirm("確定要永久刪除 #" + it.id + " 嗎？無法復原。")) throw new Error("已取消");
      await call("DELETE", "/admin/experiences/" + it.id); done("已刪除 #" + it.id);
    }));
    c.append(meta, h, p, a); box.appendChild(c);
  });
}

function setView(v) {
  view = v;
  $("tPending").className = v === "pending" ? "" : "ghost";
  $("tApproved").className = v === "approved" ? "" : "ghost";
  load();
}

$("go").onclick = async () => {
  token = $("tk").value.trim(); if (!token) return;
  $("login").classList.add("hide"); $("panel").classList.remove("hide"); view = "pending"; setView("pending");
};
$("tk").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
$("tPending").onclick = () => setView("pending");
$("tApproved").onclick = () => setView("approved");
$("reload").onclick = () => load();
$("logout").onclick = logout;
</script>
</body>
</html>
