<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>她的平凡一天</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--slate:#2c3441;--paper:#f4ebe0;--paper2:#e9dccb;--ink:#4a4036;--mut:#8a6f5a;--blue:#7f95b3;--sage:#8ea88c;--rose:#bc8d82;--line:rgba(74,64,54,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#232a35;color:#f3ece4;font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;line-height:1.75}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:16px 16px 76px;min-height:100vh}
.btn{background:#5d7390;color:#fff;border:1px solid #5d7390;padding:9px 24px;border-radius:999px;transition:.2s}
.btn:hover{background:#4a5f7a}.btn.ghost{background:transparent;color:#4a5a70}.btn.ghost:hover{background:rgba(93,115,144,.12)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.slot{position:relative;border:1px dashed rgba(255,255,255,.35);border-radius:16px;background:linear-gradient(180deg,#6f86a8 0%,#a99bb0 48%,#efb98f 80%,#f6d3a8 100%);overflow:hidden;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-size:.9rem;letter-spacing:.1em;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.slot.has{border:none}
.home .slot img{object-position:76% 35%}
.slot.bg{position:absolute;inset:0;border:none;border-radius:0}
.home{position:relative;min-height:88vh;border-radius:20px;overflow:hidden;display:flex;align-items:center}
.home .slot.bg{justify-content:flex-end;padding-right:14%}
.left{position:relative;z-index:2;width:44%;align-self:stretch;padding:9% 0 12% 7%;display:flex;flex-direction:column}.ttl{position:relative;display:inline-block;align-self:flex-start}.sun{position:absolute;right:-34px;top:-30px;width:54px;opacity:.9}
h1{font-size:clamp(2.2rem,4.8vw,4.3rem);font-weight:600;margin:0;letter-spacing:.12em;color:#fff;line-height:1.2;white-space:nowrap;text-shadow:0 2px 14px rgba(40,50,80,.5)}
.intro{display:flex;align-items:center;gap:10px;color:#fff;font-size:.95rem;margin:12px 0 0;text-shadow:0 1px 6px rgba(40,50,80,.5)}
.intro i{flex:1;border-top:1px solid rgba(255,255,255,.7)}
.menu{display:grid;gap:18px;margin-top:clamp(40px,12vh,120px);max-width:430px}
.paper{display:flex;align-items:center;gap:16px;text-align:left;border:1px solid rgba(255,255,255,.7);border-radius:16px 20px 14px 18px;padding:16px 20px;color:var(--ink);box-shadow:0 4px 14px rgba(40,40,60,.22);transition:.2s}
.paper:hover{transform:translateX(6px)}
.paper.cream{background:rgba(246,238,228,.9)}.paper.sage{background:rgba(214,222,203,.9)}.paper.blue{background:rgba(217,225,236,.9)}
.paper .ic{display:flex}.paper .ch{opacity:.7}.paper .nm{flex:1;font-size:1.3rem;font-weight:600;text-align:center}.paper small{display:block;font-size:.78rem;font-weight:400;color:var(--mut)}
.foot{position:absolute;left:6%;bottom:22px;z-index:2;display:flex;gap:18px;flex-wrap:wrap}
.foot button{background:none;border:none;color:#fff;font-size:.88rem;padding:0;text-shadow:0 1px 5px rgba(0,0,0,.5)}
.foot button+button{border-left:1px solid rgba(255,255,255,.6);padding-left:18px}.foot button:hover{text-decoration:underline}
.stage{position:relative;min-height:88vh;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.stage .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(30,36,48,.6))}
.hud{position:relative;z-index:2;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;font-size:.9rem}
.pill{background:rgba(44,52,65,.85);color:#f3ece4;border-radius:999px;padding:5px 18px}
.pill.sp{min-width:240px;border-radius:14px;padding:6px 16px}
.char{position:absolute;right:4%;bottom:0;width:30%;height:66%;z-index:1;border-radius:16px 16px 0 0}
.char.mid{left:50%;right:auto;transform:translateX(-50%);width:32%;height:68%}
.dlg{position:relative;z-index:3;margin:26px 16px 16px;max-width:780px}
.dlg.wide{margin:26px auto 16px;width:calc(100% - 32px)}
.dlg::before,.dlg::after{content:"";position:absolute;inset:0;border-radius:14px;background:#efe3d3;border:1px solid rgba(74,64,54,.15)}
.dlg::before{transform:translate(8px,8px) rotate(.6deg)}.dlg::after{transform:translate(4px,4px) rotate(-.4deg);background:#f1e6d8}
.paperin{position:relative;z-index:1;background:linear-gradient(160deg,#f8f0e6,var(--paper));color:var(--ink);border:1px solid rgba(74,64,54,.2);border-radius:14px;padding:26px 28px 22px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.nametab{position:absolute;z-index:2;top:-16px;left:18px;background:var(--slate);color:#f3ece4;padding:3px 26px;border-radius:10px 10px 4px 4px;font-size:.95rem}
.paperin h2{margin:0 0 4px;font-size:1.5rem}.tag{color:var(--mut);font-size:.9rem}
.arrow{position:absolute;right:16px;bottom:8px;color:#5d7390;font-size:.8rem}
.leftcol{position:relative;z-index:3;margin:0 16px 16px;max-width:620px}
.opts{display:grid;gap:14px;margin-top:20px}
.opt{display:flex;align-items:center;gap:16px;text-align:left;background:linear-gradient(135deg,#f8f1e7,#ebe1d3);border:1px solid rgba(74,64,54,.2);border-radius:14px 22px 14px 20px;padding:8px 20px 8px 8px;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.22);transition:.2s;font-size:1.05rem}
.opt:hover{transform:translateX(6px);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.hex{flex:none;width:58px;height:54px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;clip-path:polygon(24% 4%,76% 4%,100% 50%,76% 96%,24% 96%,0 50%)}
.cA .hex{background:var(--blue)}.cB .hex{background:var(--sage)}.cC .hex{background:var(--rose)}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.22);position:relative;margin:4px 0}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#c9a38f,#c26a62);transition:width .5s}
.bar u{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:2px dashed rgba(255,255,255,.6)}
.center .bar,.modal .bar{background:rgba(74,64,54,.15)}
table{border-collapse:collapse;width:100%;margin:8px 0}td{padding:4px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
.ph{border:1px dashed rgba(74,64,54,.35);border-radius:10px;padding:8px 14px;color:var(--mut);margin-top:8px;font-size:.92rem}
.note{font-size:.88rem;color:var(--mut);margin-top:10px}
.pos{color:#3f7a5a}.neg{color:#a8473a}
.center{max-width:720px;margin:8vh auto;text-align:center;padding:32px;background:linear-gradient(160deg,#f8f0e6,var(--paper));color:var(--ink);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.center h2{font-size:2rem;margin:.2em 0}.center p{color:var(--ink)!important}
.log{text-align:left;font-size:.92rem;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(20,24,32,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal>div{background:var(--paper);color:var(--ink);border-radius:16px;padding:24px;max-width:520px;max-height:80vh;overflow:auto}
@media(max-width:760px){.left{width:100%;padding:8% 6% 70px}.home{align-items:flex-start}.home .slot.bg{padding-right:0;justify-content:center;align-items:flex-end;padding-bottom:20px}.char{width:42%;height:36%;opacity:.85}.char.mid{width:50%;height:44%}.dlg{margin:22px 10px 10px}.dlg.wide{margin:22px auto 10px}.leftcol{margin:0 10px 10px}.paperin{padding:22px 18px 20px}.hex{width:48px;height:46px}}
.helpbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:200;background:#a8566a;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:9px 18px;font-size:.88rem;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.helpbtn:hover{background:#8f4559}
.modal{z-index:300!important}
.help{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px;max-width:640px;max-height:88vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.help h3{margin:0 0 8px;font-size:1.5rem}.help p{margin:8px 0}
.hots{display:grid;gap:10px;margin:14px 0}
.hot{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center;background:#fff9f1;border:1px solid var(--line);border-radius:12px 18px 12px 16px;padding:10px 16px}
.hot b{grid-column:1/3}.hot a{grid-row:2;font-size:2rem;font-weight:900;color:#a8566a;text-decoration:none;letter-spacing:.05em}.hot small{grid-row:2;grid-column:2;color:var(--mut)}
@media(max-width:760px){.helpbtn{font-size:.78rem;padding:8px 14px}}
</style>
</head>

      "女主角從外送員手中接過熱騰騰的泡菜鍋貼，向對方道謝後便關上門，配著綜藝節目好好享受自己的晚餐。",
      "女主角從外送員手中接過熱騰騰的泡菜鍋貼，向對方道謝後便關上門。接著，正準備打開餐盒，手機卻突然跳出一則來自陌生帳號的 LINE 訊息：「美女，我剛剛送餐時覺得妳很漂亮。有需要晚上外送可以找我，不用客氣。」女主角盯著螢幕，原本期待吃晚餐的好心情瞬間消失。她沒有回覆，腦中卻不斷浮現剛才開門取餐的畫面，對方不僅知道她的手機號碼，還知道她住在哪裡。她開始擔心，對方會不會再次聯絡她，甚至在下次送餐時出現在門口。",
      "TVBS 新聞（2024年8月報導）：〈涉犯個資法！外送員透過電話加Line騷擾女客 平台：已終止合作〉文中報導女子遭遇外送員的騷擾對方用手機號碼加入她的LINE並傳送訊息，內容提及需要幫忙或外送可以找他。她指出，第一次已讀不回後，對方又再傳送第二次訊息，讓她相當傻眼，隨即向平台客服檢舉。https://news.tvbs.com.tw/local/4015550"],
    ["直接在鍋貼店內用，但因為人太多，只能和陌生人併桌", .7, 15,
      "等餐的時候，她和同桌的人隨意聊了幾句，發現彼此意外地聊得來。熱騰騰的泡菜鍋貼端上桌，兩人一邊吃、一邊聊著生活中的瑣事，讓原本平凡的晚餐多了一點小小的驚喜。",
      "好不容易等到鍋貼上桌，女主角看著眼前香氣四溢的晚餐，開心地夾起一顆放進嘴裡。正當她專心享受期待已久的美食時，同桌的陌生人突然盯著她，笑著說：「這麼會吃，看來很常吃香蕉哦？」看見對方帶著意味深長的笑容，女主角漸漸意識到這句話可能暗指男性生殖器，頓時不知道該如何回應，只好快速吃完鍋貼離開。",
      "此情節為杜撰。Unicode / Dictionary.com（Emoji 官方文化分析）： 在 Emoji（繪文字）語言學分析中，香蕉表情符號（🍌 Banana Emoji）被廣泛且官方認定為網路文字互動中最常用來代表男性生殖器（Penis）的符號。https://www.dictionary.com/culture/emoji/banana-emoji"],
  ]),
  day(2, "女主角發現家裡濕紙巾快用完了，她決定怎麼買？",
    "女主角準備擦拭桌面時，發現濕紙巾只剩下最後幾張。她打開櫃子，才發現備用的濕紙巾也早已用完。想到平時清潔桌面、擦拭雙手都會用到濕紙巾，她決定趁今天有空趕快補貨。她拿起手機，思考要直接出門購買，還是上網訂購比較方便。", [
    ["步行到附近便利商店買濕紙巾", .7, 40,
      "女主角穿上外套，拿起手機和鑰匙，走到住家附近的便利商店。她很快找到需要的濕紙巾，結帳後沿著熟悉的街道慢慢走回家，準備繼續晚上原本的安排。",
      "女主角出門後，發現有名陌生人似乎一直出現在自己附近。起初她以為只是巧合，沒有特別在意，買完濕紙巾、離開便利商店後，再次回頭查看時發現對方彎腰偷窺裙底。女主角驚恐地跑回到便利商店求助。",
      "TVBS 新聞網（2026年8月報導）：〈桃園女遭尾隨「低頭窺裙底」！男辯：以前被欺負　竟是慣犯〉https://news.tvbs.com.tw/local/4013688"],
    ["騎機車到附近超市，順便買齊其他日用品", .8, 35,
      "女主角在超市，拿著購物籃、在貨架間挑選商品，最後拿濕紙巾和其他生活用品到櫃檯結帳後，順利回到家。",
      "女主角在超市，拿著購物籃、在貨架間挑選商品，最後拿濕紙巾和其他生活用品到櫃檯結帳後。回程途中，當她停在路口等紅燈時，一名機車騎士突然靠得很近，近得讓她忍不住側過頭看了一眼。對方卻沒有移開視線，反而直直地盯著她。綠燈亮起，她繼續往前騎，沒想到那名騎士竟一路跟在她身後。她越騎越不安，幾次想確認對方是否仍在，卻發現那輛機車始終沒有遠離。直到距離家裡只剩兩個路口時，那名騎士才突然轉向，騎往別的地方。一路上什麼事也沒有發生，但她緊繃的神經仍遲遲無法放鬆。明明已經快到家了，她卻忍不住回頭張望，心裡留下揮之不去的不安與餘悸。",
      "聯合報（2026年5月報導）：〈高雄怪男騎機車尾隨女騎士 她嚇到PO網釣出一堆人也被跟過〉https://udn.com/news/story/7320/9475890"],
    ["直接用手機網購，幾天後到超商取貨", .7, 35,
      "女主角打開購物平台，搜尋平常使用的濕紙巾，比較不同品牌的價格後，選定一款熟悉的商品並完成付款。幾天後到超商取貨，她向店員報上手機號碼，以累積會員點數，接著完成付款，順利領取包裹回家。生活一如往常，沒有發生特別的事。",
      "女主角打開購物平台，搜尋平常使用的濕紙巾，比較不同品牌的價格後，選定一款熟悉的商品並完成付款。幾天後到超商取貨，她向店員報上手機號碼，以累積會員點數，接著完成付款，順利領取包裹回家。然而，隔天收到一則陌生帳號的 LINE 訊息：「妳好，想跟妳認識當朋友。」她有些困惑，回訊息詢問對方是怎麼找到自己的 LINE。對方卻若無其事地回答：「我昨天在超商看到妳，覺得妳很可愛，想跟妳認識。剛好聽到妳唸手機號碼，就記下來了。」看著螢幕上的訊息，女主角頓時感到一陣不寒而慄。她怎麼也沒想到，自己只是到超商取個貨，為了累積會員點數而報出手機號碼，竟被陌生人刻意記下，甚至進一步找到她的社群帳號，也開始擔心對方是否還掌握了其他個人資訊，以及未來是否會再次出現在自己的生活中。",
      "聯合新聞網（2020年2月報導）：〈超商報電話被店員記下 人妻收到陌生LINE訊息「求認識」〉https://udn.com/news/story/120911/4350555"],
  ]),
  day(3, "女主角想結束一段戀情，她決定怎麼提出分手？",
    "女主角和伴侶交往了一段時間，最近卻越來越確定，這段關係已經不適合自己。她思考了幾天，終於決定提出分手。", [
    ["約到咖啡廳當面談，親口說清楚", .7, 45,
      "在兩人以前常去的咖啡廳中，女主角深吸一口氣，將心裡反覆思考過的話說出口，伴侶聽完後沉默了一會兒，雖然難以接受，最後仍答應分開。兩人各自離開，這段關係就此告一段落。",
      "在兩人以前常去的咖啡廳中，女主角深吸一口氣，將心裡反覆思考過的話說出口。伴侶聽完後，眉頭瞬間皺起，語氣越來越激動，不斷追問她為什麼要分手，女主角試著解釋，對方卻不願聽進去，突然伸手抓住她，想拉著她離開咖啡廳。她的身體瞬間僵住，下意識地縮起身子，心裡湧上一陣恐懼，擔心只要再反抗，對方就可能做出更激烈的舉動。就在這時，店員端著咖啡走近。女主角趁著對方的注意力稍微轉移，悄悄向店員比出「5、4、0」的手勢救。店員察覺異狀後協助通報警方，最後由警方到場介入處理。原本只是想好好說清楚、結束一段感情，卻在這一刻變成一場讓她害怕不已的經歷。",
      "ETtoday新聞雲（2025年2月報導）：〈店裡談分手！女方離場前「急比1手勢」店長秒報警…真的救了她〉https://www.ettoday.net/news/20250225/2915047.htm"],
    ["透過LINE傳訊息，告訴對方想分手", .7, 65,
      "女主角坐在房間裡，打開LINE對話視窗，反覆修改了好幾次訊息，才終於按下傳送：「我想了很久，覺得我們不適合繼續交往了。我希望我們就到這裡，好好結束這段關係。」一小時後，收到對方回應：「我知道了，祝福你未來順利。」女主角鬆了一口氣，開始整理自己的心情，準備迎接沒有對方的生活。",
      "女主角坐在房間裡，打開LINE對話視窗，反覆修改了好幾次訊息，才終於按下傳送：「我想了很久，覺得我們不適合繼續交往了。我希望我們就到這裡，好好結束這段關係。」幾分鐘後，收到對方回應：「幹你娘，幹、幹，草雞掰，明天會去妳家樓下堵妳啦，給我說清楚。」、「你給老子遇到一次，我就要讓妳死一次。」女主角看著這些辱罵與威脅，身體不由得戰慄，擔心這些威脅會進一步變成現實。",
      "中央社（2026年4月報導）：〈屏東男燒毀前女友機車　屏檢公共危險罪起訴〉文中報導61歲張姓男子去年11月25日與康女分手，因故發生嫌隙，張男當晚傳多則LINE訊息恐嚇康女，包含「遇到看到一次我就要讓妳死一次」等語，讓康女心生畏懼。 " + SRC_CNA],
    ["打電話提分手，希望把話說清楚", .7, 50,
      "女主角坐在房間裡，撥出伴侶的電話。在電話接通後，她努力讓自己的聲音保持平穩，說出思考已久的決定：「我想了很久，還是覺得我們價值觀不合，不適合繼續走下去了，所以...我想跟你分手。」電話另一頭沉默了片刻，伴侶回應道：「我...我知道了，雖然我還是希望能跟妳走下去，但既然妳覺得我們不適合，也只能這樣了。祝福妳未來更好。」女主角心裡有些沉重，卻也終於鬆了一口氣。她知道，這段感情告一段落了，接下來可以慢慢把生活重心放回自己身上。",
      "女主角坐在房間裡，撥出伴侶的電話。在電話接通後，她努力讓自己的聲音保持平穩，說出思考已久的決定：「我想了很久，還是覺得我們價值觀不合，不適合繼續走下去了，所以...我想跟你分手。」電話伴侶回應道：「我們哪裡不合？一定要分手嗎？」女主角再次表明決心後，對方放話嗆聲：「我不會放妳走的。」而後每天對方都奪命連環call，並收到一連串帶有威脅意味的訊息。即使她已經清楚表達不想繼續這段關係，對方仍然不肯罷休。每當手機鈴聲響起，她的心就跟著一緊，開始害怕接下來還會發生什麼事。",
      "自由時報（2026年5月報導）：〈「被分手」成恐怖情人 已婚男3天打132通電話騷擾前女友〉文中報導傅姓男子不滿曾交往的女友小麗（化名）知悉其隱瞞已婚身分，被分手後，成了恐怖情人，竟以連環奪命叩手段，在短短3天內瘋狂撥打132通電話反覆騷擾，並以LINE連續傳送「今天就跟你玩到底」、「自己要選擇地獄的」等字眼恐嚇對方，甚至將兩人合照傳給小麗的主管與現任男友。嘉義地院日前依恐嚇危害安全罪判傅男有期徒刑4月，得易科罰金。 " + SRC_CNA],
  ]),
  day(4, "週末女主角決定怎麼享受休閒時光？",
    "難得迎來假日，女主角決定暫時放下手邊的事情，好好享受屬於自己的時間。她想買幾件新衣服、看一部期待已久的電影，或是預約醫美療程，讓自己煥然一新。", [
    ["去百貨公司買新衣服", .8, 35,
      "女主角走進百貨公司的服飾店，沿著整齊的衣架慢慢挑選。她拿起一件喜歡的上衣，想像著搭配平常穿的褲子會是什麼樣子，接著帶著衣服走進試衣間。試穿後，她對著鏡子左右轉了轉，確認尺寸和版型都很合適，便開心地換回自己的衣服，拿著新挑好的衣服去結帳。",
      "女主角走進百貨公司的服飾店，沿著整齊的衣架慢慢挑選。她拿起一件喜歡的上衣，想像著搭配平常穿的褲子會是什麼樣子，接著帶著衣服走進試衣間。她關上門，準備脫下外套試穿，抬頭時卻注意到牆上的監視器角度有些奇怪，鏡頭似乎正對著更衣的方向。她嚇得立刻停止試穿，整理好衣服走出試衣間，向店家反映並報警。原本只是想買件新衣服，卻讓她開始擔心，會不會曾經在試穿衣服時，已經被人窺視或錄下影像。",
      "中天新聞（2026年8月報導）：〈慘遭看光？東區百貨試衣間驚藏攝影機　業者：已撤除並檢討〉文中報導一名消費者在臨時設置的更衣間試衣時，抬頭竟發現上方裝有疑似能拍到內部的監視器鏡頭，且該鏡頭是否有運作業者說法矛盾。https://ctinews.com/news/items/D0xdjNV2WY"],
    ["去電影院看電影", .8, 35,
      "女主角買好電影票，抱著爆米花走進影廳。燈光逐漸暗下來，女主角拿起爆米花，專心投入電影情節，隨著劇情起伏，她時而緊張、時而發笑，散場後還回味著最喜歡的片段，心滿意足地走出影廳。",
      "女主角買好電影票，抱著爆米花走進影廳。燈光逐漸暗下來，女主角拿起爆米花，專心投入電影情節，突然感覺大腿傳來異樣的觸碰。一開始她以為只是座位太窄，不小心碰到隔壁的人，沒想到那隻手竟再次伸了過來。她低頭一看，發現隔壁的陌生男子正趁著影廳昏暗，伸手觸摸她的大腿，甚至試圖用外套遮掩動作。女主角又驚又怒，立刻移開身體並向工作人員求助，隨後報警處理。電影仍在播放，她卻再也無法專心，只想盡快離開這個讓她感到不安全的地方。",
      "自由時報（2021年10月報導）：〈電影院「鹹豬手」慣犯又出沒 工程師趁黑亂摸鄰女大腿〉文中報導在電子業擔任工程師的47歲劉姓男子，今年4月到桃園市八德區某影城看電影，趁黑亂摸鄰座女子大腿被逮，由於劉男過去就有多次假看電影真摸鄰女大腿紀錄，桃園地院法官以他涉犯性騷擾防治法且為累犯，判處5月徒刑。https://news.ltn.com.tw/news/society/breakingnews/3712177"],
    ["預約醫美療程，讓自己變美", .8, 35,
      "女主角按照約定時間抵達診所。諮詢後，工作人員向她說明療程流程與注意事項，接著帶她進入診療空間準備。療程順利完成，她看著鏡中的自己，期待著恢復期結束後的樣子。離開診所時，她心情愉快，計畫接下來幾天好好照顧自己。",
      "女主角按照約定時間抵達診所。諮詢後，工作人員向她說明療程流程與注意事項，接著帶她進入診療空間準備：請她先更換衣物，準備接受療程。她換好衣服，正準備開始療程時，無意間抬頭看見天花板角落有一個外型像煙霧偵測器的裝置。她越看越覺得不對勁，仔細確認後，懷疑裝置裡竟藏有攝影鏡頭。想到自己剛才就在這個空間更衣，她頓時感到一陣不安，立即向診所人員詢問並報警。警方到場檢查後，案件進入調查。她原本是想透過療程讓自己變得更有自信，卻開始擔心，自己的隱私是否已遭到侵犯。",
      "中央社（2026年5月報導）：〈板橋愛爾麗診所疑藏針孔　新北檢警搜索數間分店〉文中報導診療間的天花板角落有不明裝置，疑似藏有攝影鏡頭。診所人員堅稱是煙霧偵測器，女子報警後，警方到場拆開確認裝置內有攝影機。https://www.cna.com.tw/news/asoc/202605050230.aspx ｜ 商周（2026年6月報導）：〈違規偷拍醫美診所遭罰50萬、停業半年！17家醫療機構名單一次看〉文中整理2026年衛服部稽查17家非法安裝密錄設備的醫療機構名單。https://www.businessweekly.com.tw/focus/blog/3021552 ｜ 衛生福利部醫事查詢系統之「美容醫學專區」分頁，已公布「侵害病人隱私遭裁罰醫療機構名單」，供民眾查詢。https://ma.mohw.gov.tw/Accessibility/AESSearch/MASearchAES"],
  ]),
  day(5, "女主角假日想來一趟城市小旅行，她決定怎麼移動？",
    "難得放假，女主角決定到另一個城市走走。她想逛逛街、吃喜歡的美食，也想去一些平常沒機會造訪的地方。查好景點後，她開始規劃交通方式：搭公車、搭捷運，或是直接叫一輛計程車？", [
    ["搭公車，沿途欣賞城市風景", .8, 35,
      "上公車後，女主角找個座位坐下，一邊看著車窗外的店家，一邊確認手機裡的地圖。抵達目的地後，她按下下車鈴，跟著其他乘客走下車，開始今天的城市小旅行。",
      "上公車後，女主角找個座位坐下，一邊看著車窗外的店家，一邊確認手機裡的地圖。公車煞車的時候，站在旁邊的陌生人突然向她的方向前傾，用生殖器觸碰女主角的大腿。她愣了一下，接著往旁邊躲。下車後，女主角感受到一股噁心與羞恥感，才意識到自己被性騷擾。事後，女主角每當看見公車就會想起被性騷擾的噁心與羞恥，因此再也不願搭公車。",
      "聯合報（2026年10月報導）：〈性騷擾累犯搭公車重施故技 這次藉煞車下體碰觸少女大腿判6月〉https://udn.com/news/story/7317/9797097"],
    ["步行，沿著街道逛逛特色店家", .7, 45,
      "女主角拿著飲料沿著街道慢慢散步。看到有趣的小店，她便停下腳步逛逛；走累了，就到路邊的咖啡店坐一會兒。不急著趕行程，享受著偶然發現新風景的驚喜。",
      "女主角拿著飲料沿著街道慢慢散步。突然，一名陌生男子從後方迅速靠近，伸手觸碰她的私密部位，隨即轉身逃跑。女主角受到驚嚇，立刻轉身喝斥，同時向周遭的人求助，事後報警並就醫。原本輕鬆的城市漫步，卻成為一段她再也不願回想的惡夢，原本喜歡獨自散步、隨興探索城市的她，開始對身後經過的腳步聲格外敏感，也總忍不住回頭確認有沒有人跟著自己，後來，她再也沒有一個人出門漫步。",
      "TVBS新聞（2026年9月報導）：〈西門町偷襲短褲妹！噁男亂伸裙底　被抓還說「耶」後果慘了〉文中報導陳姓男子尾隨剛從超商領完包裹的女子，從後方接近，將手指伸入被害人短褲褲縫，隔著內褲碰觸私密部位，台北地院審理後，依《性騷擾防制法》判1年8個月。https://news.tvbs.com.tw/local/4020097"],
    ["搭計程車，直接前往目的地", .9, 80,
      "女主角利用叫車 App，輸入目的地並確認車資。幾分鐘後，計程車抵達，她核對車牌、上車繫好安全帶。車子沿著導航路線前進，她看著窗外的街景，趁著車程規劃接下來要去的店家。抵達目的地後，她付清車資、拿好隨身物品下車，順利展開今天的行程。",
      "女主角利用叫車 App，輸入目的地並確認車資。幾分鐘後，計程車抵達，她核對車牌、上車繫好安全帶。開了一段時間後，她發現車子似乎逐漸偏離導航路線，司機卻沒有停下來確認。她開始感到不安，詢問對方為什麼改道，司機以「這一帶他很熟悉，導航的路線會花更多時間」為理由搪塞，繼續把車開往人煙稀少的地方，抵達偏僻地點後，司機強迫她發生性行為。女主角在恐懼中難以反抗，直到事後才有機會求助並報警。性暴力創傷使女主角後來深受PTSD所苦。",
      "公視新聞（2025年11月報導）：〈計程車司機性侵乘客判刑8年 叫車平台：已停止媒合該司機〉https://news.pts.org.tw/article/783139"],
  ]),
  day(6, "女主角參與朋友揪的酒局，在酒局上她決定怎麼做 ？",
    "女主角收到朋友傳來的訊息，邀請她週末一起去酒吧喝酒。她想著好一陣子沒跟大家聚會了，便答應赴約。當天晚上，她來到酒吧，和朋友們聊天、喝酒，享受難得的放鬆時光。", [
    ["跟著大家一起玩喝酒遊戲「真心話大冒險」（被酒瓶轉到的人要選擇真心話或是大冒險，若是拒絕回答或是拒絕完成任務，則要罰喝一杯酒）", .8, 35,
      "女主角坐在朋友們中間，酒瓶轉到自己的時候，分享之前的戀情與糗事，或是比出各種奇怪的動作，大家笑成一團。幾輪遊戲結束後，大家開始深入了解彼此的生活近況，她也度過了一個愉快的夜晚。",
      "女主角坐在朋友們中間，酒瓶轉到自己的時候，要她大冒險和隔壁的人嘴對嘴親吻，女主角感到很尷尬，正想拒絕的時候，對方趁著大家起鬨，伸手摟住她的腰。她立刻推開對方，表示自己不喜歡這樣，對方卻笑著說：「玩遊戲而已，幹嘛那麼認真？」其他人也跟著笑，讓她一時不知道該如何反應，開始懷疑自己是不是反應過大。",
      "自由時報（2024年7月報導）：〈酒醉玩國王遊戲 女遭3友人脫衣猥褻〉文中報導涉嫌假藉國王指令，聯手將被害人拖至房間床上並壓制，被害人一直抵抗、喊叫「不要」，卻被脫衣猥褻。https://news.ltn.com.tw/news/society/breakingnews/4722864"],
    ["接受朋友介紹的陌生人遞來的酒", .9, 80,
      "聚會進行到一半，朋友介紹一位新認識的人給女主角。大家聊得很投緣，對方還主動幫她拿了一杯調酒。女主角道謝後接過酒杯，和大家一起聊天。後來，她發現自己與新朋友有不少共同興趣，兩人交換了社群帳號，愉快地結束這場聚會。",
      "聚會進行到一半，朋友介紹一位新認識的人給女主角。大家聊得很投緣，對方還主動幫她拿了一杯調酒。女主角道謝後接過酒杯，和大家一起聊天。過了一會兒，她開始感到暈眩、意識混亂，身體狀況與實際飲酒量不相稱。她試著向朋友表達不舒服，卻發現自己越來越難以集中精神。再次醒來後，女主角全身赤裸躺在飯店的床上，立刻報警。事後，在尿液檢驗中驗出安眠藥反應，並透過監視器得知，那位新認識的朋友將自己帶離酒吧、下藥性侵。性暴力創傷使女主角深受PTSD、憂鬱症及焦慮症所苦。",
      "中央社新聞（2024年1月報導）：〈對女性友人下藥性侵 知名魔術師判刑7年4月〉https://www.cna.com.tw/news/asoc/202401220048.aspx ｜ 中央社新聞（2019年12月報導）：〈對女友下藥供男網友性侵 二審判男5年徒刑〉https://www.cna.com.tw/news/asoc/201912120138.aspx"],
    ["離席如廁後，回來將酒杯裡剩下的酒飲盡", .9, 80,
      "女主角坐回朋友身旁，看到杯中還剩下一些酒，便順手拿起來喝完，繼續聽大家分享最近的生活趣事。聚會接近尾聲時，大家互相道別、約好下次再見，女主角也帶著愉快的心情回家。",
      "女主角坐回朋友身旁，看到杯中還剩下一些酒，便順手拿起來喝完，繼續聽大家分享最近的生活趣事。沒過多久，她開始覺得身體有些異常，隨後失去意識。再次醒來後，女主角在飯店的某個房間內，發現衣衫不整，便立刻報警與就醫，事後驗出安眠藥反應、同行友人的DNA，便憤怒地提告。性暴力創傷使女主角後來深受PTSD與暴食症所苦。",
      "TVBS新聞（2025年1月報導）：〈喝完酒昏迷！保險業務經理　遭控下藥性侵〉https://news.tvbs.com.tw/local/2745052"],
  ]),
  day(7, "女主角想在網路上販售二手衣服，她決定怎麼刊登商品？",
    "女主角最近整理衣櫃，發現有幾件衣服雖然保存得很好，卻已經很少穿了。她想把這些衣服放到網路上販售，讓衣服找到新的主人，也能替自己賺回一些零用錢。她打開手機，開始思考要怎麼刊登商品。", [
    ["在Facebook社團發布二手衣物的照片", .8, 35,
      "貼文發布後，朋友紛紛在留言處留下「推推」，使貼文推播給更多人看見，不久後就有人私訊詢問，順利談成交易。",
      "貼文發布後，朋友紛紛在留言處留下「推推」，使貼文推播給更多人看見。一名陌生網友注意到女主角的個人頭像是她自己的照片，在留言區留下「可以試穿給我看嗎？我是說衣服啦，別想歪」。看到這則留言，女主角胃裡翻攪、感到噁心，氣得回覆：「把性暗示包裝成玩笑，不代表幽默。」原本只是想販售二手衣物，卻突然成為陌生人開性玩笑的對象，女主角感到既憤怒又無奈。",
      "公視新聞（2022年1月報導）：〈東華二手耳環性平調查結果出爐 女大生：惡意雖龐大 卻非無法撼動〉https://news.pts.org.tw/article/563220"],
    ["在二手交易平台上架衣服照片", .7, 35,
      "女主角仔細標示尺寸、材質、穿著次數與價格。幾名買家陸續傳來訊息詢問，她耐心回答問題，最後和其中一名買家談妥價格，順利完成交易。",
      "女主角仔細標示尺寸、材質、穿著次數與價格。一名買家表示想收購「報廢內褲」，詢問是否會出售「報廢內褲」。看到這則訊息，女主角立刻感到不適與噁心，就封鎖了對方。雖然知道有人有喜歡原味內褲的偏好，但自己的貼文內根本沒有提及相關的內容，因此覺得界線被侵犯了。",
      "自由時報（2020年8月報導）：〈櫃姐失戀「斷捨離」網售舊衣 噁男求買「報廢內褲」〉https://news.ltn.com.tw/news/society/breakingnews/3250005"],
    ["在IG發布實穿照（將衣服穿在自己身上）", .8, 35,
      "為了讓買家能更清楚地看到衣服的版型與長度，女主角挑選幾件準備販售的衣服，穿在身上拍攝實穿照。買家很快就能掌握衣服的樣貌，也讓商品更容易找到適合的新主人。",
      "為了讓買家能更清楚地看到衣服的版型與長度，女主角挑選幾件準備販售的衣服，穿在身上拍攝實穿照。一名買家不斷私訊詢問她的身材尺寸、平常穿著習慣，並傳裸露生殖器的照片給她。女主角感到噁心想吐，立刻封鎖對方。",
      "ETtoday新聞雲（2025年10月報導）：〈瑀熙賣二手衣「被私訊生殖器照」　掀噁心內幕：收到超過100張〉。https://star.ettoday.net/news/3043955"],
  ]),
  day(8, "女主角想藉由交友軟體尋找未來的伴侶，她決定怎麼跟網友互動？",
    "下班後，女主角躺在床上滑著交友軟體。她希望能認識一個聊得來、彼此欣賞的人，慢慢發展成穩定的伴侶關係。滑了一陣子後，她終於和幾個感覺不錯的人配對成功。看著對方傳來的訊息，她開始思考，接下來該怎麼和對方互動。", [
    ["和配對成功的人繼續聊天，分享彼此的生活", .7, 35,
      "女主角和配對對象每天分享生活中的大小事，從喜歡的音樂聊到理想的伴侶關係。隨著話題越來越多，兩人逐漸熟悉彼此，也開始期待每天的訊息往來。",
      "女主角和配對對象每天分享生活中的大小事。某天對方突然傳來一張裸露生殖器的照片，接著要求女主角也傳送私密照給他，並傳「真的好想去幹妳」等訊息。女主角感到噁心想吐，立刻封鎖這位配對對象。",
      "自由時報（2022年8月報導）：〈騙女童回傳下體照 傳「屌照」2男這下慘了〉文中報導兩名男子透過TIK TOK認識年紀還小的女童，再分別傳送自己的生殖器照片，並透過文字表達想要性交或看女童下體，誘使女童回傳下體照片。https://news.ltn.com.tw/news/society/breakingnews/4021328"],
    ["和聊了一段時間的對象約吃飯", .8, 80,
      "聊了一段時間後，女主角和對方決定見面，約在一間氣氛輕鬆的餐廳。兩人聊起各自的生活與感情經歷，發現彼此相處起來比想像中自在。離開前，他們約好下次再見面，女主角對這段關係多了一些期待。",
      "聊了一段時間後，女主角和對方決定見面，約在一間氣氛輕鬆的餐廳。見面時，女主角喝下水後，逐漸感到頭暈、四肢無力，意識也開始模糊。她察覺自己的狀態不太對勁，卻已經難以清楚表達或保護自己。對方趁她失去自主能力時，將她帶到飯店，並做出未經同意的性行為。事後，女主角就醫與提告，雖然讓對方付出法律代價，但女主角的未來持續深受PTSD與憂鬱症所苦。",
      "Yahoo新聞（2024年9月報導）：〈邀約女網友下藥性侵　被害人痛斥：毀了我的一生〉https://tw.news.yahoo.com/%E9%82%80%E7%B4%84%E5%A5%B3%E7%B6%B2%E5%8F%8B%E4%B8%8B%E8%97%A5%E6%80%A7%E4%BE%B5-%E8%A2%AB%E5%AE%B3%E4%BA%BA%E7%97%9B%E6%96%A5-%E6%AF%80%E4%BA%86%E6%88%91%E7%9A%84-%E7%94%9F-092057540.html"],
    ["和配對對象分享自己的社群帳號", .8, 40,

  wk(2, "總部大樓的硬體安全巡檢", "看著總務部剛完成的大規模巡檢公告，你接下來會怎麼做？",

  wk(3, "公共業務承攬管理員的職務重組", "走進主管辦公室前，你打算採取何種溝通策略來確認後續的分工？",

  wk(4, "長途出差途中的路邊暫停休息", "在疲憊的長途車程休息空檔，你打算如何應對當前的獨處片刻？",

  wk(5, "新進倉管同仁的職務調整面談", "進入會議室與特助及主管坐下後，你準備如何陳述調職需求？",

  wk(6, "前檯服務人員的新一季服儀規範", "看到新頒布的細部服儀指引，你決定如何調整自己的上班裝扮？",

  wk(7, "年終尾牙餐會上的同樂敬酒", "面對迎面而來熱情招呼的業務副總，你打算如何回應這場敬酒？",

/* ============ 邏輯：隨機判定與壓力值 ============ */
const clamp = v => Math.max(CONFIG.min, Math.min(CONFIG.max, v));
// 洗牌（Fisher–Yates）：只產生「題目索引」的新順序，不會更動原始題庫陣列
const shuffleIdx = n => {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
function rollOutcome(opt) {
  const total = opt.pSafe + opt.pEvent || 1;            // 兩者以比例正規化，確保總和為 100%
  return Math.random() < opt.pEvent / total ? "event" : "safe";
}

  const [pv, setPv] = useState(null);
  const [chap, setChap] = useState("daily");
  const [order, setOrder] = useState(() => shuffleIdx(CHAP_EVENTS.daily.length));   // 本輪題目出場順序（索引）
  const events = CHAP_EVENTS[chap], chDef = CHAPTERS.find(c => c.key === chap);
  const ev = { ...events[order[idx]], num: idx + 1, chName: chDef.name, total: order.length, last: idx === order.length - 1 };

  const reset = k => { const key = typeof k === "string" ? k : chap; setChap(key); setOrder(shuffleIdx(CHAP_EVENTS[key].length)); setIdx(0); setStress(CONFIG.startStress); setLog([]); setResult(null); setScreen("story"); };
  const home = () => { setIdx(0); setStress(CONFIG.startStress); setLog([]); setResult(null); setScreen("home"); };

  const pick = i => {                       // 只在點擊時判定一次，結果存入 state
    if (result) return;
    const opt = ev.options[i], outcome = rollOutcome(opt), isEv = outcome === "event";
    const eventD = isEv ? opt.eventDelta : 0, respD = isEv ? opt.responseDelta : 0;
    const after = clamp(stress + eventD + respD);
    setResult({ optIndex: i, outcome, before: stress, eventD, respD, after });
    setStress(after);
    setLog(l => [...l, { id: ev.num, title: ev.title, kind: outcome, d: after - stress,
      label: `${"ABC"[i]}．${opt.text}｜${isEv ? TYPE_NAME[opt.eventType] : "平安通過"}` }]);
    setScreen("result");
  };
  const skip = () => {
    setLog(l => [...l, { id: ev.num, title: ev.title, kind: "skip", d: 0, label: "（測試略過）" }]);
    advance(stress);
  };
  const advance = s => {
    setResult(null);
    if (s >= CONFIG.gameOverAt) setScreen("over");
    else if (idx + 1 >= order.length) setScreen("end");
    else { setIdx(idx + 1); setScreen("story"); }
  };

  if (screen === "home") return <Home onStart={reset} onPreview={c => { setPv(c); setScreen("preview"); }} />;
  if (screen === "preview") return <Preview ch={pv} onBack={home} />;
  if (screen === "story") return <Story ev={ev} stress={stress} onNext={() => setScreen("choose")} onHome={home} onRestart={reset} onSkip={skip} />;
  if (screen === "choose") return <Choose ev={ev} stress={stress} onPick={pick} />;
  if (screen === "result" && result) return <Result ev={ev} stress={stress} r={result} onNext={() => advance(result.after)} />;
  if (screen === "over") return <End over chName={chDef.name} stress={stress} log={log} onRestart={reset} onHome={home} />;
  if (screen === "end") return <End chName={chDef.name} stress={stress} log={log} onRestart={reset} onHome={home} onOther={home} />;
  return null;
}
const HOTLINES = [
  ["安心專線", "1925", "衛生福利部提供，24 小時免付費心理諮詢。"],
  ["生命線協談專線", "1995", "提供 24 小時電話協談與情緒支持。"],
  ["張老師專線", "1980", "提供情緒疏導與生活適應輔導，服務時間依官方公告為準。"],
];
function Help({ onClose }) {
  return (<div className="modal" onClick={onClose}><div className="help" onClick={e => e.stopPropagation()}>
    <h3>求助與支持</h3>
    <p>本遊戲旨在透過互動情境，讓玩家認識日常生活中的厭女現象、性別刻板印象、性別歧視與性別暴力，並思考這些現象如何影響人們的生活。</p>
    <p>部分情境可能使玩家聯想到自身經驗，進而感到不舒服、焦慮、難過或產生壓力。</p>
    <p>如果你在遊玩過程中感到不舒服，可以隨時暫停或停止遊戲。如果你需要進一步的支持，也可以透過以下專線尋求協助。</p>
    <div className="hots">{HOTLINES.map(([n, num, d]) => (
      <div className="hot" key={num}><b>{n}</b><a href={"tel:" + num}>{num}</a><small>{d}</small></div>))}</div>
    <div className="row" style={{ justifyContent: "center" }}><button className="btn" onClick={onClose}>關閉，回到遊戲</button></div>
  </div></div>);
}
function App() {
  const [help, setHelp] = useState(false);   // 只是畫面開關，不影響遊戲進度、壓力值或結局
  return (<><Game />
    <button className="helpbtn" onClick={() => setHelp(true)}>玩遊戲時感到不舒服，怎麼辦？</button>
    {help && <Help onClose={() => setHelp(false)} />}</>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
